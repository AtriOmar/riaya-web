services:
  web:
    image: ${DOCKER_IMAGE}
    container_name: riaya_web
    restart: unless-stopped
    ports:
      - "50002:3000"
    networks:
      - riaya_network
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    # --- Security Hardening ---
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/.next/cache

networks:
  riaya_network:
    name: riaya_network
    external: true
