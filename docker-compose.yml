services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    # --- Security Hardening ---
    # Make the container file system read-only
    read_only: true
    # Drop all root capabilities by default to prevent privilege escalation
    cap_drop:
      - ALL
    # Prevent the container processes from gaining new privileges
    security_opt:
      - no-new-privileges:true
    # Mount temporary file systems for directories that Next.js needs to write to
    tmpfs:
      - /tmp
      # Next.js image optimization and data cache
      - /app/.next/cache