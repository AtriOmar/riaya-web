name: Deploy to Ubuntu

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-web" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-web" >> $GITHUB_ENV

      - name: Create environment file securely
        run: |
          echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml,.env,package.json,pnpm-lock.yaml,drizzle.config.ts,drizzle,src/db"
          target: "/var/www/riaya.omaratri.com"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/riaya.omaratri.com
            
            # Export the exact image we want to use
            export DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest
            
            # Log in to GHCR to pull the private image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 1. Run Database Migrations
            echo "Running Drizzle Migrations..."
            docker run --rm -e CI=true -v $(pwd):/app -w /app --network riaya_network node:22-alpine sh -c "npm install -g drizzle-kit pg dotenv tsx drizzle-orm && NODE_PATH=\$(npm root -g) drizzle-kit migrate"
            
            # 2. Pull the latest image
            docker compose -f docker-compose.yml pull web
            
            # 3. Start/Update the container
            docker compose -f docker-compose.yml up -d
            
            # 4. Cleanup old/dangling docker images to save disk space
            docker image prune -f
