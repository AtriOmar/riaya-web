services:
  postgres:
    image: postgres:18.0
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - riaya_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riaya"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  riaya_postgres_data:
    name: riaya_postgres_data
